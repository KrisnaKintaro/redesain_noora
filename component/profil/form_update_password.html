<div class="mb-6 mt-2">
    <h2 class="text-2xl font-extrabold text-brand-dark uppercase tracking-widest mb-4">UPDATE PASSWORD</h2>
    <button onclick="window.navigateTo('Profil Saya')" class="flex items-center gap-2 text-sm font-bold text-brand-dark bg-white border border-slate-200 px-5 py-2.5 rounded-lg hover:bg-slate-50 transition-colors shadow-sm focus:outline-none w-max">
        <i class="ph-bold ph-arrow-left"></i> Kembali
    </button>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200/60 p-6 md:p-8 mb-10 max-w-4xl">
    <h3 class="text-xl font-extrabold text-brand-dark border-b border-slate-100 pb-4 mb-6">Ubah Password</h3>

    <form class="space-y-6" onsubmit="event.preventDefault(); alert('Password Berhasil Diubah!'); window.navigateTo('Profil Saya');">
        <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
            <label class="w-full md:w-1/3 text-sm font-semibold text-brand-dark">Kata Sandi Lama</label>
            <input type="password" placeholder="Old Password..." required class="w-full md:w-2/3 border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-brand-dark focus:outline-none focus:border-brand-yellow focus:ring-1 focus:ring-brand-yellow">
        </div>
        <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
            <label class="w-full md:w-1/3 text-sm font-semibold text-brand-dark">Kata Sandi Baru</label>
            <input type="password" placeholder="New Password..." required class="w-full md:w-2/3 border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-brand-dark focus:outline-none focus:border-brand-yellow focus:ring-1 focus:ring-brand-yellow">
        </div>
        <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
            <label class="w-full md:w-1/3 text-sm font-semibold text-brand-dark">Konfirmasi Kata Sandi Baru</label>
            <input type="password" placeholder="Confirm new Password..." required class="w-full md:w-2/3 border border-slate-300 rounded-lg px-4 py-2.5 text-sm text-brand-dark focus:outline-none focus:border-brand-yellow focus:ring-1 focus:ring-brand-yellow">
        </div>

        <div class="pt-6 flex justify-end">
            <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-6 rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2 focus:outline-none">
                <i class="ph-fill ph-floppy-disk"></i> Update Password
            </button>
        </div>
    </form>
</div>
