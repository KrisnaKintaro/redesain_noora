<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noora Quran - Dashboard</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #f8fafc;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              brand: {
                yellow: "#FEDD58",
                dark: "#1E293B",
                light: "#F8FAFC",
                muted: "#64748B",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="text-brand-dark antialiased">
    <div id="navbar-container"></div>

    <main class="max-w-6xl mx-auto p-4 sm:p-6 mt-2">
      <!-- HOME -->
      <div id="welcome-container"></div>
      <div id="program-materi-container"></div>

      <div id="statistik-container"></div>
      <div id="daftar-program-container"></div>
      <div id="faq-container"></div>
    </main>

    <script>
      // FETCHING COMPONENT KE MASTER
      Promise.all([
        fetch("component/navbar.html").then((res) => res.text()),
        fetch("component/home/welcome_banner.html").then((res) => res.text()),
        fetch("component/home/program_dan_materi.html").then((res) =>
          res.text(),
        ),
      ])
        .then(([navData, welcomeData, programData]) => {
          document.getElementById("navbar-container").innerHTML = navData;
          document.getElementById("welcome-container").innerHTML = welcomeData;
          document.getElementById("program-materi-container").innerHTML =
            programData;

          initNavbarLogic();
          initHomeLogic();
        })
        .catch((err) => console.error("Ada error fetch cuy:", err));

      function initNavbarLogic() {
        // LOGIC MODE MOBILE
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const closeSidebarBtn = document.getElementById("close-sidebar-btn");
        const mobileSidebar = document.getElementById("mobile-sidebar");
        const mobileOverlay = document.getElementById("mobile-overlay");
        const mobileMenuLinks = document.querySelectorAll("#mobile-nav-menu a");

        if (mobileMenuLinks.length > 0) {
          mobileMenuLinks.forEach((link) => {
            link.addEventListener("click", function (e) {
              e.preventDefault();

              mobileMenuLinks.forEach((item) => {
                item.className =
                  "flex items-center gap-3 px-4 py-3 text-brand-muted hover:text-brand-dark hover:bg-slate-50 font-medium text-sm rounded-lg border border-transparent transition-all";

                const icon = item.querySelector("i");
                if (icon) {
                  icon.className = icon.className
                    .replace("ph-fill", "ph")
                    .replace("text-brand-yellow", "");
                }
              });

              this.className =
                "flex items-center gap-3 px-4 py-3 bg-brand-yellow/20 text-brand-dark font-bold text-sm rounded-lg border border-brand-yellow/50 transition-all mobile-active-tab";

              const activeIcon = this.querySelector("i");
              if (activeIcon) {
                activeIcon.className =
                  activeIcon.className.replace("ph", "ph-fill") +
                  " text-brand-yellow";
              }
            });
          });
        }
        if (mobileMenuBtn && mobileSidebar) {
          mobileMenuBtn.addEventListener("click", () => {
            mobileOverlay.classList.remove("hidden");

            setTimeout(() => {
              mobileOverlay.classList.remove("opacity-0");
              mobileSidebar.classList.remove("-translate-x-full");
            }, 10);
          });

          const closeSidebar = () => {
            mobileSidebar.classList.add("-translate-x-full");
            mobileOverlay.classList.add("opacity-0");

            setTimeout(() => {
              mobileOverlay.classList.add("hidden");
            }, 300);
          };

          closeSidebarBtn.addEventListener("click", closeSidebar);
          mobileOverlay.addEventListener("click", closeSidebar);
        }

        // LOGIC DROPDOWN PROFIL
        const profileBtn = document.getElementById("profile-btn");
        const profileDropdown = document.getElementById("profile-dropdown");
        const profileCaret = document.getElementById("profile-caret");

        if (profileBtn && profileDropdown && profileCaret) {
          // Kalau tombol profil diklik
          profileBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            profileDropdown.classList.toggle("hidden");
            profileCaret.classList.toggle("rotate-180");
          });

          // Kalau user klik di luar area dropdown
          window.addEventListener("click", (e) => {
            if (
              !profileBtn.contains(e.target) &&
              !profileDropdown.contains(e.target)
            ) {
              profileDropdown.classList.add("hidden");
              profileCaret.classList.remove("rotate-180");
            }
          });
        }

        // LOGIC PILL MENU ACTIVE/INACTIVE
        const navMenuLinks = document.querySelectorAll("#nav-menu a");

        navMenuLinks.forEach((link) => {
          link.addEventListener("click", function (e) {
            e.preventDefault();

            // Hapus mode "Active" dari semua menu
            navMenuLinks.forEach((item) => {
              item.className =
                "flex items-center gap-2 px-4 py-1.5 text-brand-muted hover:text-brand-dark hover:bg-white/50 font-medium text-sm rounded-md border border-transparent transition-all";

              const icon = item.querySelector("i");
              if (icon) {
                icon.className = icon.className
                  .replace("ph-fill", "ph")
                  .replace("text-brand-yellow", "");
              }
            });

            // Tambahkan mode "Active" ke menu yang diklik
            this.className =
              "flex items-center gap-2 px-4 py-1.5 bg-white text-brand-dark font-semibold text-sm rounded-md shadow-sm border border-slate-200/50 transition-all active-tab";

            const activeIcon = this.querySelector("i");
            if (activeIcon) {
              activeIcon.className =
                activeIcon.className.replace("ph", "ph-fill") +
                " text-brand-yellow";
            }
          });
        });
      }

      function initHomeLogic() {
        // 1. LOGIC SCROLL MULAI BELAJAR
        const btnMulai = document.getElementById("btn-mulai-belajar");
        const programContainer = document.getElementById(
          "program-materi-container",
        );

        if (btnMulai && programContainer) {
          btnMulai.addEventListener("click", () => {
            // Scroll mulus otomatis
            programContainer.scrollIntoView({
              behavior: "smooth",
              block: "start",
            });
          });
        }

        // 2. LOGIC PROGRAM & MATERI
        const dropdownBtn = document.getElementById("dropdown-program-btn");
        const dropdownMenu = document.getElementById("dropdown-program-menu");
        const programTitleDisplay = document.getElementById(
          "program-title-display",
        );
        const selectedProgramLabel = document.getElementById(
          "selected-program-label",
        );

        const tabContainer = document.getElementById("tab-container");
        const tabTeori = document.getElementById("tab-teori");
        const tabPraktik = document.getElementById("tab-praktik");
        const classListContainer = document.getElementById(
          "class-list-container",
        );

        const overlayBlur = document.getElementById("pr-ujian-overlay");
        const contentReal = document.getElementById("pr-ujian-content");
        const displayClassName = document.getElementById("display-class-name");

        // Data Dummy buat List Kelas cuy (Bisa lu ubah sesuka hati)
        const dataKelas = {
          teori: [
            "Pekan 1 - Pengantar Hukum",
            "Pekan 2 - Mim Sakinah (Ikhfa & Idgham)",
            "Pekan 3 - Mim Sakinah (Idzhar)",
            "Ujian Tengah Program (Teori)",
          ],
          praktik: [
            "Praktik 1 - Makharijul Huruf",
            "Praktik 2 - Sifatul Huruf",
            "Praktik 3 - Talaqqi Surat Pendek",
            "Ujian Praktik Akhir",
          ],
        };

        // Fungsi Buka Tutup Dropdown Program
        dropdownBtn.addEventListener("click", () =>
          dropdownMenu.classList.toggle("hidden"),
        );

        // Fungsi waktu milih Modul
        document.querySelectorAll(".program-item").forEach((item) => {
          item.addEventListener("click", (e) => {
            const btn = e.currentTarget;
            const type = btn.dataset.type; // 'teori', 'praktik', atau 'both'
            const name = btn.dataset.name;

            // Ubah teks judul
            programTitleDisplay.textContent = name;
            programTitleDisplay.classList.remove("text-brand-yellow");
            selectedProgramLabel.textContent = name;
            dropdownMenu.classList.add("hidden"); // Tutup dropdown

            // Munculin bungkus tab-nya
            tabContainer.classList.remove("hidden");

            // Reset Tab (Sembunyiin semua & Hapus efek aktif)
            tabTeori.classList.add("hidden");
            tabPraktik.classList.add("hidden");
            tabTeori.className =
              "flex-1 text-brand-muted font-medium text-xs py-2 rounded-md transition-all";
            tabPraktik.className =
              "flex-1 text-brand-muted font-medium text-xs py-2 rounded-md transition-all";

            // Logic nampilin tab sesuai tipe modul
            if (type === "teori" || type === "both") {
              tabTeori.classList.remove("hidden");
              tabTeori.classList.add(
                "bg-brand-yellow",
                "text-brand-dark",
                "font-bold",
                "shadow-sm",
              ); // Default aktif
            }
            if (type === "praktik" || type === "both") {
              tabPraktik.classList.remove("hidden");
              if (type === "praktik") {
                tabPraktik.classList.add(
                  "bg-brand-yellow",
                  "text-brand-dark",
                  "font-bold",
                  "shadow-sm",
                );
              }
            }

            // Render Daftar Kelas berdasarkan tipe awal
            renderClassList(type === "praktik" ? "praktik" : "teori");
          });
        });

        // Fungsi Render Tombol Kelas ke Sidebar
        function renderClassList(listType) {
          classListContainer.innerHTML = ""; // Bersihin isi sebelumnya

          // Kembalikan Mode Blur!
          overlayBlur.classList.remove("hidden");
          setTimeout(() => overlayBlur.classList.remove("opacity-0"), 10);
          contentReal.classList.remove("opacity-100");
          contentReal.classList.add("opacity-0");

          const items = dataKelas[listType] || [];

          items.forEach((cls) => {
            const btn = document.createElement("button");
            btn.className =
              "w-full text-left p-3 text-brand-muted text-sm font-medium hover:bg-slate-50 hover:text-brand-dark rounded-md transition-colors border-l-[3px] border-transparent class-item-btn";
            btn.textContent = cls;

            // Kalau Kelasnya diklik
            btn.addEventListener("click", () => {
              // Hapus kuning dari semua tombol
              document.querySelectorAll(".class-item-btn").forEach((b) => {
                b.className =
                  "w-full text-left p-3 text-brand-muted text-sm font-medium hover:bg-slate-50 hover:text-brand-dark rounded-md transition-colors border-l-[3px] border-transparent class-item-btn";
              });

              // Kasih kuning ke tombol yang diklik
              btn.className =
                "w-full text-left p-3 bg-slate-50 border-l-[3px] border-brand-yellow rounded-r-md text-sm font-semibold text-brand-dark transition-colors class-item-btn";

              // HAPUS BLUR OVERLAY & MUNCULIN KONTEN
              overlayBlur.classList.add("opacity-0");
              setTimeout(() => overlayBlur.classList.add("hidden"), 300);
              contentReal.classList.remove("opacity-0");
              contentReal.classList.add("opacity-100");

              // Ubah Judul Kelas di Kanan
              displayClassName.textContent = cls;
            });

            classListContainer.appendChild(btn);
          });
        }

        // Logic Klik Tab Teori/Praktik
        tabTeori.addEventListener("click", () => {
          tabTeori.className =
            "flex-1 bg-brand-yellow text-brand-dark font-bold text-xs py-2 rounded-md shadow-sm transition-all";
          tabPraktik.className =
            "flex-1 text-brand-muted font-medium text-xs py-2 hover:text-brand-dark transition-all";
          renderClassList("teori");
        });

        tabPraktik.addEventListener("click", () => {
          tabPraktik.className =
            "flex-1 bg-brand-yellow text-brand-dark font-bold text-xs py-2 rounded-md shadow-sm transition-all";
          tabTeori.className =
            "flex-1 text-brand-muted font-medium text-xs py-2 hover:text-brand-dark transition-all";
          renderClassList("praktik");
        });

        // LOGIC DATA PR & UJIAN
        const tabPrBtn = document.getElementById("tab-pr-btn");
        const tabUjianBtn = document.getElementById("tab-ujian-btn");
        const taskListContainer = document.getElementById(
          "task-list-container",
        );

        const taskData = [
          {
            type: "PR",
            title: "Tugas Pemahaman Hukum Mim",
            deadline: "15 Agustus 2026",
            status: "belum",
            score: null,
          },
          {
            type: "PR",
            title: "Hafalan Praktik Pekan 1",
            deadline: "10 Agustus 2026",
            status: "selesai",
            score: 95,
          },
          {
            type: "PR",
            title: "Resume Materi Teori",
            deadline: "12 Agustus 2026",
            status: "selesai",
            score: 88,
          },
          {
            type: "Ujian",
            title: "Ujian Tengah Program (Teori)",
            deadline: "30 Agustus 2026",
            status: "belum",
            score: null,
          },
          {
            type: "Ujian",
            title: "Pre-Test Kemampuan Awal",
            deadline: "1 Agustus 2026",
            status: "selesai",
            score: 100,
          },
        ];

        // Fungsi buat render (mencetak) Card ke layar
        function renderTasks(tabType) {
          taskListContainer.innerHTML = ""; // Bersihin isi wadah dulu

          // Saring data berdasarkan tab yang lagi aktif (PR atau Ujian)
          const filteredTasks = taskData.filter(
            (task) => task.type === tabType,
          );

          if (filteredTasks.length === 0) {
            taskListContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50/50">
                    <i class="ph-fill ph-file-dashed text-4xl text-slate-300 mb-2"></i>
                    <p class="text-sm text-brand-muted font-medium">Belum ada ${tabType} untuk kelas ini.</p>
                </div>`;
            return;
          }

          // Looping data yang udah disaring buat dibikin HTML Card-nya
          filteredTasks.forEach((task) => {
            let statusBadge, actionUI, borderClass;

            if (task.status === "selesai") {
              // Tampilan kalau SUDAH SELESAI
              borderClass =
                "border-green-200 hover:border-green-400 bg-green-50/30";
              statusBadge = `<span class="text-[10px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded mb-1 inline-flex items-center gap-1"><i class="ph-fill ph-check-circle"></i> Selesai</span>`;
              actionUI = `
                    <div class="flex flex-col items-end">
                        <span class="text-[10px] text-brand-muted font-bold uppercase tracking-wider mb-1">Nilai Akhir</span>
                        <span class="text-xl font-extrabold text-green-600 leading-none">${task.score}</span>
                    </div>`;
            } else {
              // Tampilan kalau BELUM DIKERJAKAN
              borderClass =
                "border-slate-200 hover:border-brand-yellow bg-white";
              statusBadge = `<span class="text-[10px] bg-brand-yellow/20 text-yellow-700 font-bold px-2 py-0.5 rounded mb-1 inline-block">${task.type}</span>`;
              actionUI = `<button class="px-5 py-2.5 bg-brand-yellow text-brand-dark text-xs font-bold rounded-lg hover:bg-[#F5D345] shadow-sm transition-transform hover:scale-105 active:scale-95">Kerjakan</button>`;
            }

            const cardHTML = `
                <div class="p-4 border ${borderClass} rounded-xl shadow-sm transition-all flex justify-between items-center">
                    <div>
                        ${statusBadge}
                        <h4 class="font-bold text-brand-dark text-sm mt-1">${task.title}</h4>
                        <p class="text-xs text-brand-muted mt-1 flex items-center gap-1">
                            <i class="ph ph-calendar-blank"></i> Batas: ${task.deadline}
                        </p>
                    </div>
                    ${actionUI}
                </div>
            `;
            // Masukin HTML-nya ke dalem wadah
            taskListContainer.insertAdjacentHTML("beforeend", cardHTML);
          });
        }

        // Logic Klik Tab PR
        tabPrBtn.addEventListener("click", () => {
          // Ubah style tab
          tabPrBtn.className =
            "px-8 py-3 text-sm font-bold text-brand-dark border-b-2 border-brand-yellow transition-colors focus:outline-none";
          tabUjianBtn.className =
            "px-8 py-3 text-sm font-medium text-brand-muted hover:text-brand-dark border-b-2 border-transparent transition-colors focus:outline-none";
          // Render data PR
          renderTasks("PR");
        });

        // Logic Klik Tab Ujian
        tabUjianBtn.addEventListener("click", () => {
          // Ubah style tab
          tabUjianBtn.className =
            "px-8 py-3 text-sm font-bold text-brand-dark border-b-2 border-brand-yellow transition-colors focus:outline-none";
          tabPrBtn.className =
            "px-8 py-3 text-sm font-medium text-brand-muted hover:text-brand-dark border-b-2 border-transparent transition-colors focus:outline-none";
          // Render data Ujian
          renderTasks("Ujian");
        });
      }
    </script>
  </body>
</html>
