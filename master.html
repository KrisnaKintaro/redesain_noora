<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noora Quran - Dashboard</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #f8fafc;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              brand: {
                yellow: "#FEDD58",
                dark: "#1E293B",
                light: "#F8FAFC",
                muted: "#64748B",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="text-brand-dark antialiased">
    <div id="navbar-container"></div>

    <main class="max-w-6xl mx-auto p-4 sm:p-6 mt-2">
      <!-- HOME -->
      <div id="welcome-container"></div>
      <div id="program-materi-container"></div>

      <div id="statistik-container"></div>
      <div id="daftar-program-container"></div>
      <div id="faq-container"></div>
    </main>

    <script>
      // FETCHING COMPONENT KE MASTER
      Promise.all([
        fetch("component/navbar.html").then((res) => res.text()),
        fetch("component/home/welcome_banner.html").then((res) => res.text()),
        fetch("component/home/program_dan_materi.html").then((res) =>
          res.text(),
        ),
        fetch("component/home/statistik_dan_status_pendaftaran.html").then(
          (res) => res.text(),
        ),
        fetch("component/home/daftar_program_tersedia.html").then((res) =>
          res.text(),
        ),
        fetch("component/home/faq.html").then((res) => res.text()),
      ])
        .then(
          ([
            navData,
            welcomeData,
            programData,
            statistikData,
            daftarProgramData,
            faqData,
          ]) => {
            document.getElementById("navbar-container").innerHTML = navData;
            document.getElementById("welcome-container").innerHTML =
              welcomeData;
            document.getElementById("program-materi-container").innerHTML =
              programData;
            document.getElementById("statistik-container").innerHTML =
              statistikData;
            document.getElementById("daftar-program-container").innerHTML =
              daftarProgramData;
            document.getElementById("faq-container").innerHTML = faqData;

            initNavbarLogic();
            initHomeLogic();
          },
        )
        .catch((err) => console.error("Ada error fetch cuy:", err));

      function initNavbarLogic() {
        // LOGIC MODE MOBILE
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const closeSidebarBtn = document.getElementById("close-sidebar-btn");
        const mobileSidebar = document.getElementById("mobile-sidebar");
        const mobileOverlay = document.getElementById("mobile-overlay");
        const mobileMenuLinks = document.querySelectorAll("#mobile-nav-menu a");

        if (mobileMenuLinks.length > 0) {
          mobileMenuLinks.forEach((link) => {
            link.addEventListener("click", function (e) {
              e.preventDefault();

              mobileMenuLinks.forEach((item) => {
                item.className =
                  "flex items-center gap-3 px-4 py-3 text-brand-muted hover:text-brand-dark hover:bg-slate-50 font-medium text-sm rounded-lg border border-transparent transition-all";

                const icon = item.querySelector("i");
                if (icon) {
                  icon.className = icon.className
                    .replace("ph-fill", "ph")
                    .replace("text-brand-yellow", "");
                }
              });

              this.className =
                "flex items-center gap-3 px-4 py-3 bg-brand-yellow/20 text-brand-dark font-bold text-sm rounded-lg border border-brand-yellow/50 transition-all mobile-active-tab";

              const activeIcon = this.querySelector("i");
              if (activeIcon) {
                activeIcon.className =
                  activeIcon.className.replace("ph", "ph-fill") +
                  " text-brand-yellow";
              }
            });
          });
        }
        if (mobileMenuBtn && mobileSidebar) {
          mobileMenuBtn.addEventListener("click", () => {
            mobileOverlay.classList.remove("hidden");

            setTimeout(() => {
              mobileOverlay.classList.remove("opacity-0");
              mobileSidebar.classList.remove("-translate-x-full");
            }, 10);
          });

          const closeSidebar = () => {
            mobileSidebar.classList.add("-translate-x-full");
            mobileOverlay.classList.add("opacity-0");

            setTimeout(() => {
              mobileOverlay.classList.add("hidden");
            }, 300);
          };

          closeSidebarBtn.addEventListener("click", closeSidebar);
          mobileOverlay.addEventListener("click", closeSidebar);
        }

        // LOGIC DROPDOWN PROFIL
        const profileBtn = document.getElementById("profile-btn");
        const profileDropdown = document.getElementById("profile-dropdown");
        const profileCaret = document.getElementById("profile-caret");

        if (profileBtn && profileDropdown && profileCaret) {
          // Kalau tombol profil diklik
          profileBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            profileDropdown.classList.toggle("hidden");
            profileCaret.classList.toggle("rotate-180");
          });

          // Kalau user klik di luar area dropdown
          window.addEventListener("click", (e) => {
            if (
              !profileBtn.contains(e.target) &&
              !profileDropdown.contains(e.target)
            ) {
              profileDropdown.classList.add("hidden");
              profileCaret.classList.remove("rotate-180");
            }
          });
        }

        // LOGIC PILL MENU ACTIVE/INACTIVE
        const navMenuLinks = document.querySelectorAll("#nav-menu a");

        navMenuLinks.forEach((link) => {
          link.addEventListener("click", function (e) {
            e.preventDefault();

            // Hapus mode "Active" dari semua menu
            navMenuLinks.forEach((item) => {
              item.className =
                "flex items-center gap-2 px-4 py-1.5 text-brand-muted hover:text-brand-dark hover:bg-white/50 font-medium text-sm rounded-md border border-transparent transition-all";

              const icon = item.querySelector("i");
              if (icon) {
                icon.className = icon.className
                  .replace("ph-fill", "ph")
                  .replace("text-brand-yellow", "");
              }
            });

            // Tambahkan mode "Active" ke menu yang diklik
            this.className =
              "flex items-center gap-2 px-4 py-1.5 bg-white text-brand-dark font-semibold text-sm rounded-md shadow-sm border border-slate-200/50 transition-all active-tab";

            const activeIcon = this.querySelector("i");
            if (activeIcon) {
              activeIcon.className =
                activeIcon.className.replace("ph", "ph-fill") +
                " text-brand-yellow";
            }
          });
        });
      }

      function initHomeLogic() {
        // 1. LOGIC SCROLL MULAI BELAJAR
        const btnMulai = document.getElementById("btn-mulai-belajar");
        const programContainer = document.getElementById(
          "program-materi-container",
        );

        if (btnMulai && programContainer) {
          btnMulai.addEventListener("click", () => {
            programContainer.scrollIntoView({
              behavior: "smooth",
              block: "start",
            });
          });
        }

        // ==========================================
        // 2. SIMULASI API DATA PROGRAM & MATERI
        // ==========================================
        const apiDataProgram = [
          {
            id: "prog-1",
            type: "teori",
            name: "Quranic Arabic Level 1",
            desc: "Hanya Kelas Teori",
            materi: {
              teori: [
                {
                  judul: "Pekan 1 - Pengantar Hukum Mim",
                  tanggal: "Senin, 10 Agustus 2026 - 09:00 WIB",
                },
                {
                  judul: "Pekan 2 - Mim Sakinah (Ikhfa)",
                  tanggal: "Senin, 17 Agustus 2026 - 09:00 WIB",
                },
                {
                  judul: "Ujian Tengah Program (Teori)",
                  tanggal: "Senin, 24 Agustus 2026 - 09:00 WIB",
                },
              ],
              praktik: [],
            },
          },
          {
            id: "prog-2",
            type: "praktik",
            name: "Tahsin & Tajwid Praktik",
            desc: "Hanya Kelas Praktik",
            materi: {
              teori: [],
              praktik: [
                {
                  judul: "Praktik 1 - Makharijul Huruf",
                  tanggal: "Selasa, 11 Agustus 2026 - 13:00 WIB",
                },
                {
                  judul: "Praktik 2 - Sifatul Huruf",
                  tanggal: "Selasa, 18 Agustus 2026 - 13:00 WIB",
                },
              ],
            },
          },
          {
            id: "prog-3",
            type: "both",
            name: "Bahasa Arab Komprehensif",
            desc: "Kelas Teori & Praktik",
            materi: {
              teori: [
                {
                  judul: "Pekan 1 - Pengenalan Isim",
                  tanggal: "Rabu, 12 Agustus 2026 - 08:00 WIB",
                },
              ],
              praktik: [
                {
                  judul: "Praktik 1 - Hiwar Dasar",
                  tanggal: "Kamis, 13 Agustus 2026 - 15:30 WIB",
                },
              ],
            },
          },
        ];

        const dropdownBtn = document.getElementById("dropdown-program-btn");
        const dropdownMenu = document.getElementById("dropdown-program-menu");
        const programTitleDisplay = document.getElementById(
          "program-title-display",
        );
        const selectedProgramLabel = document.getElementById(
          "selected-program-label",
        );
        const tabContainer = document.getElementById("tab-container");
        const tabTeori = document.getElementById("tab-teori");
        const tabPraktik = document.getElementById("tab-praktik");
        const classListContainer = document.getElementById(
          "class-list-container",
        );
        const overlayBlur = document.getElementById("pr-ujian-overlay");
        const contentReal = document.getElementById("pr-ujian-content");
        const displayClassName = document.getElementById("display-class-name");
        const displayClassDate = document.getElementById("display-class-date");

        // Variabel penyimpan data yang lagi aktif dipilih
        let activeProgramData = null;

        // Fungsi Buka Tutup Dropdown Program
        dropdownBtn.addEventListener("click", () =>
          dropdownMenu.classList.toggle("hidden"),
        );

        // RENDER DATA DROPDOWN PROGRAM DARI API
        dropdownMenu.innerHTML = "";
        apiDataProgram.forEach((program) => {
          const btn = document.createElement("button");
          btn.className =
            "w-full text-left px-4 py-3 text-sm hover:bg-slate-50 border-b border-slate-100 transition-colors";
          btn.innerHTML = `
            <span class="block font-bold text-brand-dark">${program.name}</span>
            <span class="text-xs text-brand-muted">${program.desc}</span>
          `;

          btn.addEventListener("click", () => {
            activeProgramData = program;

            // Ubah teks judul
            programTitleDisplay.textContent = program.name;
            programTitleDisplay.classList.remove("text-brand-yellow");
            selectedProgramLabel.textContent = program.name;
            dropdownMenu.classList.add("hidden");

            // Munculin bungkus tab-nya
            tabContainer.classList.remove("hidden");

            // Reset Tab
            tabTeori.classList.add("hidden");
            tabPraktik.classList.add("hidden");
            tabTeori.className =
              "flex-1 text-brand-muted font-medium text-xs py-2 rounded-md transition-all";
            tabPraktik.className =
              "flex-1 text-brand-muted font-medium text-xs py-2 rounded-md transition-all";

            // Atur Tab berdasarkan Tipe
            if (program.type === "teori" || program.type === "both") {
              tabTeori.classList.remove("hidden");
              tabTeori.classList.add(
                "bg-brand-yellow",
                "text-brand-dark",
                "font-bold",
                "shadow-sm",
              );
            }
            if (program.type === "praktik" || program.type === "both") {
              tabPraktik.classList.remove("hidden");
              if (program.type === "praktik") {
                tabPraktik.classList.add(
                  "bg-brand-yellow",
                  "text-brand-dark",
                  "font-bold",
                  "shadow-sm",
                );
              }
            }

            // Render Daftar Kelas
            renderClassList(program.type === "praktik" ? "praktik" : "teori");
          });

          dropdownMenu.appendChild(btn);
        });

        // Fungsi Render List Kelas
        function renderClassList(listType) {
          classListContainer.innerHTML = "";

          // Reset Area Kanan (Tutup konten, munculkan Blur)
          overlayBlur.classList.remove("hidden");
          setTimeout(() => overlayBlur.classList.remove("opacity-0"), 10);
          contentReal.classList.remove("opacity-100");
          contentReal.classList.add("opacity-0");

          if (!activeProgramData) return;

          const items = activeProgramData.materi[listType] || [];

          items.forEach((cls) => {
            const btn = document.createElement("button");
            btn.className =
              "w-full text-left p-3 text-brand-muted text-sm font-medium hover:bg-slate-50 hover:text-brand-dark rounded-md transition-colors border-l-[3px] border-transparent class-item-btn";
            btn.textContent = cls.judul;

            btn.addEventListener("click", () => {
              // Styling Item Aktif
              document.querySelectorAll(".class-item-btn").forEach((b) => {
                b.className =
                  "w-full text-left p-3 text-brand-muted text-sm font-medium hover:bg-slate-50 hover:text-brand-dark rounded-md transition-colors border-l-[3px] border-transparent class-item-btn";
              });
              btn.className =
                "w-full text-left p-3 bg-slate-50 border-l-[3px] border-brand-yellow rounded-r-md text-sm font-semibold text-brand-dark transition-colors class-item-btn";

              // Buka Blur & Tampilkan Konten
              overlayBlur.classList.add("opacity-0");
              setTimeout(() => overlayBlur.classList.add("hidden"), 300);
              contentReal.classList.remove("opacity-0");
              contentReal.classList.add("opacity-100");

              // SUNTIK DATA JUDUL & TANGGAL KELAS DINAMIS
              displayClassName.textContent = cls.judul;
              displayClassDate.textContent = cls.tanggal;

              // Trigger klik tab PR biar datanya langsung load
              tabPrBtn.click();
            });

            classListContainer.appendChild(btn);
          });
        }

        tabTeori.addEventListener("click", () => {
          tabTeori.className =
            "flex-1 bg-brand-yellow text-brand-dark font-bold text-xs py-2 rounded-md shadow-sm transition-all";
          tabPraktik.className =
            "flex-1 text-brand-muted font-medium text-xs py-2 hover:text-brand-dark transition-all";
          renderClassList("teori");
        });

        tabPraktik.addEventListener("click", () => {
          tabPraktik.className =
            "flex-1 bg-brand-yellow text-brand-dark font-bold text-xs py-2 rounded-md shadow-sm transition-all";
          tabTeori.className =
            "flex-1 text-brand-muted font-medium text-xs py-2 hover:text-brand-dark transition-all";
          renderClassList("praktik");
        });

        // ==========================================
        // 3. LOGIC DATA PR & UJIAN
        // ==========================================
        const tabPrBtn = document.getElementById("tab-pr-btn");
        const tabUjianBtn = document.getElementById("tab-ujian-btn");
        const taskListContainer = document.getElementById(
          "task-list-container",
        );

        const taskData = [
          {
            type: "PR",
            title: "Tugas Pemahaman Hukum Mim",
            deadline: "15 Agustus 2026",
            status: "belum",
            score: null,
          },
          {
            type: "PR",
            title: "Hafalan Praktik",
            deadline: "10 Agustus 2026",
            status: "selesai",
            score: 95,
          },
          {
            type: "Ujian",
            title: "Ujian Tengah Program (Teori)",
            deadline: "30 Agustus 2026",
            status: "belum",
            score: null,
          },
          {
            type: "Ujian",
            title: "Pre-Test Kemampuan Awal",
            deadline: "1 Agustus 2026",
            status: "selesai",
            score: 100,
          },
        ];

        function renderTasks(tabType) {
          taskListContainer.innerHTML = "";
          const filteredTasks = taskData.filter(
            (task) => task.type === tabType,
          );

          if (filteredTasks.length === 0) {
            taskListContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50/50">
                    <i class="ph-fill ph-file-dashed text-4xl text-slate-300 mb-2"></i>
                    <p class="text-sm text-brand-muted font-medium">Belum ada ${tabType} untuk kelas ini.</p>
                </div>`;
            return;
          }

          filteredTasks.forEach((task) => {
            let statusBadge, actionUI, borderClass;
            if (task.status === "selesai") {
              borderClass =
                "border-green-200 hover:border-green-400 bg-green-50/30";
              statusBadge = `<span class="text-[10px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded mb-1 inline-flex items-center gap-1"><i class="ph-fill ph-check-circle"></i> Selesai</span>`;
              actionUI = `<div class="flex flex-col items-end"><span class="text-[10px] text-brand-muted font-bold uppercase tracking-wider mb-1">Nilai Akhir</span><span class="text-xl font-extrabold text-green-600 leading-none">${task.score}</span></div>`;
            } else {
              borderClass =
                "border-slate-200 hover:border-brand-yellow bg-white";
              statusBadge = `<span class="text-[10px] bg-brand-yellow/20 text-yellow-700 font-bold px-2 py-0.5 rounded mb-1 inline-block">${task.type}</span>`;
              actionUI = `<button class="px-5 py-2.5 bg-brand-yellow text-brand-dark text-xs font-bold rounded-lg hover:bg-[#F5D345] shadow-sm transition-transform hover:scale-105 active:scale-95">Kerjakan</button>`;
            }

            taskListContainer.insertAdjacentHTML(
              "beforeend",
              `
                <div class="p-4 border ${borderClass} rounded-xl shadow-sm transition-all flex justify-between items-center">
                    <div>
                        ${statusBadge}
                        <h4 class="font-bold text-brand-dark text-sm mt-1">${task.title}</h4>
                        <p class="text-xs text-brand-muted mt-1 flex items-center gap-1">
                            <i class="ph ph-calendar-blank"></i> Batas: ${task.deadline}
                        </p>
                    </div>
                    ${actionUI}
                </div>
            `,
            );
          });
        }

        tabPrBtn.addEventListener("click", () => {
          tabPrBtn.className =
            "px-8 py-3 text-sm font-bold text-brand-dark border-b-2 border-brand-yellow transition-colors focus:outline-none";
          tabUjianBtn.className =
            "px-8 py-3 text-sm font-medium text-brand-muted hover:text-brand-dark border-b-2 border-transparent transition-colors focus:outline-none";
          renderTasks("PR");
        });

        tabUjianBtn.addEventListener("click", () => {
          tabUjianBtn.className =
            "px-8 py-3 text-sm font-bold text-brand-dark border-b-2 border-brand-yellow transition-colors focus:outline-none";
          tabPrBtn.className =
            "px-8 py-3 text-sm font-medium text-brand-muted hover:text-brand-dark border-b-2 border-transparent transition-colors focus:outline-none";
          renderTasks("Ujian");
        });

        // LOGIC DATA STATISTIK & STATUS PENDAFTARAN
        const valTotalProgram = document.getElementById("val-total-program");
        const valTerdaftarProgram = document.getElementById(
          "val-terdaftar-program",
        );
        const valTidakLolos = document.getElementById("val-tidak-lolos");
        const statusListContainer = document.getElementById(
          "status-list-container",
        );

        if (valTotalProgram && statusListContainer) {
          const apiDataDashboard = {
            statistik: { total: 6, terdaftar: 6, tidakLolos: 0 },
            statusPendaftaran: [
              {
                judul: "Mad Thabii - Angkatan 2 - 2025",
                subJudul: null,
                badgeText: "Diterima",
                badgeColor: "bg-green-100 text-green-700",
                labelTipe: "Pengumuman:",
                pesanHtml:
                  "Selamat! Anda berhasil lolos seleksi. Silakan ikuti kelas wajib dan kelas praktik sesuai jadwal yang telah ditentukan. <strong class='text-brand-dark font-extrabold'>Senin 2025, 11:00WIB</strong>",
              },
              {
                judul: "Tafkhim & Tarqiq - Angkatan 3 - 2025",
                subJudul: "(Tafkhim & Tarqiq)",
                badgeText: "Pemilihan Kelas Praktek",
                badgeColor: "bg-brand-yellow/30 text-yellow-700",
                labelTipe: "Pengumuman:",
                pesanHtml:
                  "Selamat! Anda telah berhasil mendaftar pada program di Noora - Quran. Silakan ikuti tahapan selanjutnya.",
              },
            ],
          };

          valTotalProgram.textContent = apiDataDashboard.statistik.total;
          valTerdaftarProgram.textContent =
            apiDataDashboard.statistik.terdaftar;
          valTidakLolos.textContent = apiDataDashboard.statistik.tidakLolos;

          statusListContainer.innerHTML = "";

          apiDataDashboard.statusPendaftaran.forEach((item) => {
            let subJudulRender = item.subJudul
              ? `<br><span class="text-[11px] font-medium text-brand-muted">${item.subJudul}</span>`
              : "";
            statusListContainer.insertAdjacentHTML(
              "beforeend",
              `
                <div class="border border-slate-200 rounded-lg p-4 bg-white hover:border-brand-yellow/50 transition-colors shadow-sm">
                    <div class="flex justify-between items-start mb-2 gap-2">
                        <span class="text-sm font-bold text-brand-dark leading-tight">${item.judul} ${subJudulRender}</span>
                        <span class="${item.badgeColor} text-[10px] font-extrabold px-2 py-0.5 rounded-full text-center min-w-max tracking-wide">${item.badgeText}</span>
                    </div>
                    <span class="bg-red-400 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm inline-block mb-2">${item.labelTipe}</span>
                    <p class="text-xs text-brand-muted leading-relaxed">${item.pesanHtml}</p>
                </div>
            `,
            );
          });
        }
        const availableProgramsContainer = document.getElementById(
          "available-programs-container",
        );

        if (availableProgramsContainer) {
          const apiDataAvailablePrograms = [
            {
              id: "new-prog-1",
              title: "testing nih (Tajwid Advance)",
              startDate: "08 Agustus 2026 10:25",
              endDate: "31 Agustus 2026 10:25",
              description:
                "Program lanjutan untuk memperdalam ilmu tajwid dengan praktik intensif bersama pengajar bersertifikat. Peserta akan difokuskan pada penguasaan makharijul huruf dan sifatul huruf secara mendalam agar bacaan semakin tartil dan sesuai sanad.",
            },
            {
              id: "new-prog-2",
              title: "Bahasa Arab Dasar - Angkatan 4",
              startDate: "15 September 2026 08:00",
              endDate: "15 Desember 2026 10:00",
              description:
                "Kelas dasar bagi pemula yang ingin memahami kaidah bahasa Arab dari nol. Cocok untuk semua kalangan. Materi meliputi pengenalan isim, fi'il, huruf, serta penyusunan kalimat (jumlah mufeedah) untuk percakapan sehari-hari.",
            },
            {
              id: "new-prog-3",
              title: "Hafalan Quran Intensif (Juz 30)",
              startDate: "01 Oktober 2026 16:00",
              endDate: "31 Desember 2026 17:30",
              description:
                "Program khusus hafalan Juz 30 (Juz 'Amma) dengan metode tikrar dan setoran rutin. Didampingi oleh musyrif berpengalaman untuk memastikan kelancaran dan kekuatan hafalan (mutqin) kamu selama masa karantina.",
            },
            {
              id: "new-prog-4",
              title: "Fiqih Ibadah Praktis",
              startDate: "10 November 2026 19:30",
              endDate: "10 Januari 2027 21:00",
              description:
                "Membahas tata cara ibadah sehari-hari sesuai sunnah, mulai dari thaharah (bersuci), wudhu, mandi junub, hingga tata cara shalat wajib dan shalat sunnah lengkap dengan penjelasan dalil-dalil shohih.",
            },
          ];

          availableProgramsContainer.innerHTML = "";

          apiDataAvailablePrograms.forEach((prog) => {
            const cardHTML = `
              <div class="border border-slate-200 rounded-xl p-5 bg-white hover:border-brand-yellow hover:shadow-md transition-all flex flex-col self-start group">
                  <h4 class="font-bold text-brand-dark text-base mb-1.5 group-hover:text-yellow-600 transition-colors">${prog.title}</h4>
                  
                  <div class="flex items-start gap-1.5 text-[11px] font-medium text-brand-muted mb-4 bg-slate-50 p-2 rounded-lg border border-slate-100">
                      <i class="ph-fill ph-calendar-blank text-brand-yellow text-sm mt-0.5"></i>
                      <span>${prog.startDate} <br> <span class="text-slate-400">s/d</span> ${prog.endDate}</span>
                  </div>
                  
                  <!-- PERBAIKAN: Hapus flex-1 biar gak maksa ngedorong layout pas lagi ketutup -->
                  <div class="text-xs text-brand-muted leading-relaxed mb-5">
                      <strong class="text-brand-dark block mb-1 uppercase tracking-wide text-[10px]">Deskripsi Program</strong>
                      
                      <p id="desc-${prog.id}" class="line-clamp-2 transition-all duration-300">${prog.description}</p>
                  </div>
                  
                  <button onclick="toggleDeskripsi('${prog.id}', this)" class="mt-auto text-xs font-bold text-brand-dark hover:text-yellow-600 flex items-center gap-1 w-max transition-colors focus:outline-none">
                      <span class="btn-text">Lihat Selengkapnya</span> 
                      <i class="ph-bold ph-caret-down transform transition-transform duration-300 icon-caret"></i>
                  </button>
              </div>
            `;

            availableProgramsContainer.insertAdjacentHTML(
              "beforeend",
              cardHTML,
            );
          });
        }

        // FUNGSI BUAT BUKA TUTUP TEKS
        window.toggleDeskripsi = function (id, btnElement) {
          const descElement = document.getElementById(`desc-${id}`);
          const btnText = btnElement.querySelector(".btn-text");
          const btnIcon = btnElement.querySelector(".icon-caret");

          if (descElement.classList.contains("line-clamp-2")) {
            descElement.classList.remove("line-clamp-2");
            btnText.textContent = "Sembunyikan";
            btnIcon.classList.replace("ph-caret-down", "ph-caret-up");
          } else {
            descElement.classList.add("line-clamp-2");
            btnText.textContent = "Lihat Selengkapnya";
            btnIcon.classList.replace("ph-caret-up", "ph-caret-down");
          }
        };

        // LOGIC DATA FAQ (ACCORDION)
        const faqListContainer = document.getElementById("faq-list-container");

        if (faqListContainer) {
          const apiDataFaq = [
            {
              question: "Apa itu Noora - Quran?",
              answer: "Noora - Quran adalah platform digital yang didedikasikan untuk memfasilitasi pembelajaran Al-Quran yang terstruktur, mulai dari tajwid, tahsin, hingga pemahaman bahasa Arab secara komprehensif."
            },
            {
              question: "Bagaimana cara daftar di Noora - Quran?",
              answer: "Anda dapat mendaftar dengan memilih program yang tersedia di atas, klik tombol 'Lihat Selengkapnya', dan ikuti petunjuk pendaftaran yang muncul. Setelah itu tunggu hasil seleksinya di menu Status Pendaftaranmu."
            },
            {
              question: "Apakah kelas dilakukan secara online atau offline?",
              answer: "Saat ini, sebagian besar kelas teori dilakukan secara online via zoom/gmeet, sedangkan kelas praktik bisa disesuaikan apakah hybrid atau full online sesuai dengan program yang Anda ikuti."
            },
            {
              question: "Bagaimana jika saya tidak lolos seleksi program?",
              answer: "Jangan berkecil hati. Anda masih bisa mendaftar di program lain atau menunggu pembukaan angkatan (batch) selanjutnya. Histori penolakan bisa dilihat di kotak statistik."
            }
          ];

          faqListContainer.innerHTML = "";

          apiDataFaq.forEach((faq, index) => {
            const faqHTML = `
              <div class="border border-slate-200 rounded-lg overflow-hidden transition-all bg-slate-50/50 hover:border-brand-yellow/50 group">
                  <!-- Tombol Pertanyaan -->
                  <button onclick="toggleFaq('faq-ans-${index}', this)" class="w-full text-left px-5 py-4 flex justify-between items-center focus:outline-none">
                      <span class="font-semibold text-brand-dark text-sm pr-4 group-hover:text-yellow-700 transition-colors">${faq.question}</span>
                      <i class="ph-bold ph-caret-down text-brand-muted transition-transform duration-300 transform icon-caret group-hover:text-yellow-600"></i>
                  </button>
                  
                  <!-- Wadah Jawaban (Default: hidden) -->
                  <div id="faq-ans-${index}" class="hidden px-5 pb-4 pt-1 text-xs text-brand-muted leading-relaxed border-t border-slate-100/80 bg-white">
                      ${faq.answer}
                  </div>
              </div>
            `;
            
            faqListContainer.insertAdjacentHTML("beforeend", faqHTML);
          });
        }

        // FUNGSI BUAT BUKA TUTUP ACCORDION FAQ
        window.toggleFaq = function(ansId, btnElement) {
            const ansElement = document.getElementById(ansId);
            const iconElement = btnElement.querySelector('.icon-caret');

            if (ansElement.classList.contains('hidden')) {
                ansElement.classList.remove('hidden');
                iconElement.classList.replace('ph-caret-down', 'ph-caret-up');
            } else {
                ansElement.classList.add('hidden');
                iconElement.classList.replace('ph-caret-up', 'ph-caret-down');
            }
        };
      }
    </script>
  </body>
</html>
